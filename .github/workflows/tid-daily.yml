name: TID Daily Briefing

on:
  schedule:
    # 5 AM UTC = midnight EST = 12:00 AM EST
    # Adjust cron for EST: 5 AM UTC = 0 5 * * *
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install dotenv googleapis

      - name: Run TID briefing script
        env:
          GOG_KEYRING_PASSWORD: ""
        run: node tid-briefing.js
